<section>
  <h2>Projects</h2>

  <app-project-form (create)="onCreate($event)" />

  @if (loading()) {
    <p>Loading projects...</p>
  } @else if (projects().length === 0) {
    <p>No projects yet. Create the first one above.</p>
  } @else {
    <div class="project-grid">
      @for (project of projects(); track project.id) {
        <app-project-card [project]="project" (delete)="onDelete($event)" (viewTasks)="onViewTasks($event)" />
      }
    </div>
  }
</section>
