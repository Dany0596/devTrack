<form class="project-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="name">Name</label>
    <input id="name" type="text" formControlName="name" placeholder="Project name" />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <span class="error">Name is required (max 120 characters).</span>
    }
  </div>

  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="2" placeholder="Optional description"></textarea>
  </div>

  <button type="submit" class="primary">Add project</button>
</form>
